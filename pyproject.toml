[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vwnpy"
version = "0.2.0"
description = "VWN — Xray management panel (Python CLI)"
requires-python = ">=3.8"
dependencies = [
    "click",
    "rich",
]

[project.scripts]
vwn = "vwn.cli:cli"

[tool.setuptools]
packages = ["vwn", "vwn.core", "vwn.modules", "vwn.tui", "vwn.data"]

[tool.setuptools.package-data]
"vwn.data" = ["*.conf", "*.html"]
