# Nginx (loopback на 127.0.0.1:__NGINX_LOOPBACK_PORT__), self-steal.
# Xray Reality (443): serverNames = [__DOMAIN__], dest = 127.0.0.1:__NGINX_LOOPBACK_PORT__, xver = 0.
# Клиенты, прошедшие Reality-аутентификацию (Vision), обрабатываются Xray.
# Всё остальное (gRPC, XHTTP, подписки, зонды) попадает сюда по TLS и получает
# настоящий сертификат __DOMAIN__ — SNI и сертификат совпадают.
#   - /sub/ → статические .txt/.html/.yaml
#   - /<grpc-service> → Xray gRPC (VLESS+gRPC, grpc_pass h2c)
#   - /<xhttp-path>   → Xray XHTTP (grpc_pass h2c)
#   - /               → заглушка (proxy_pass STUB)

log_format main_safe '$remote_addr - [$time_local] $status $body_bytes_sent '
                     '"$http_user_agent"';

server {
    listen 127.0.0.1:__NGINX_LOOPBACK_PORT__ ssl;
    http2 on;
    server_name __DOMAIN__;

    # h2-соединения XHTTP/gRPC простаивают между запросами: дефолтные 65s из
    # основного конфига рвут их раньше, чем нужно (официальный пример: 5m).
    keepalive_timeout 30m;
    client_header_timeout 5m;

    ssl_certificate     /etc/nginx/cert/cert.pem;
    ssl_certificate_key /etc/nginx/cert/cert.key;
    ssl_trusted_certificate /etc/nginx/cert/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Для сертификатов Let's Encrypt стейплинг не действует (OCSP отключён
    # 2025-08-06): nginx лишь пишет предупреждение. Строки можно удалить.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver __RESOLVER__ valid=300s;
    resolver_timeout 5s;
    add_header Strict-Transport-Security 'max-age=63072000; includeSubDomains' always;

    # Xray gRPC (VLESS+gRPC). Только grpc_pass (h2c до Xray); proxy_pass с
    # HTTP/2 к бэкенду (nginx 1.30) для gRPC не проверялся. Xray-клиент ходит
    # на /<serviceName>/Tun (gun) или /<serviceName>/TunMulti (multi). Префикс
    # БЕЗ хвостового "/": для location со "/" на конце и grpc_pass nginx отвечает
    # 301 на запрос "/<serviceName>", что выдаёт существование пути сканеру.
    # Не-gRPC запросы получают 404. Таймауты большие: gRPC-стрим живёт часами,
    # дефолтные 60s рвут простаивающий туннель (client_body_timeout считается
    # между чтениями тела запроса).
    location ^~ /__GRPC_SERVICE__ {
        if ($content_type !~ "^application/grpc") {
            return 404;
        }
        client_max_body_size 0;
        client_body_buffer_size 0;
        client_body_timeout 1w;
        grpc_read_timeout 1w;
        grpc_send_timeout 1w;
        # Тот же размер буфера ответа, что и у XHTTP: downlink gRPC-туннеля так же
        # объёмен. Нарезку кадров к клиенту всё равно ограничивает http2_chunk_size
        # (8k), выигрыш только в числе чтений из Xray.
        grpc_buffer_size 64k;
        send_timeout 1w;
        grpc_set_header Host $host;
        access_log off;
        grpc_pass grpc://127.0.0.1:__XRAY_GRPC_PORT__;
    }

    # Xray XHTTP — ТОЛЬКО grpc_pass (h2c до Xray). Stream-up за nginx с HTTP/1.1
    # до Xray обрезает загрузки (xray-core #7180); обход — grpc_pass либо
    # scStreamUpServerSecs=-1 на серверном inbound. Режим выбирает клиент в
    # ссылке, серверный inbound всегда mode=auto и принимает все режимы.
    # Таймауты 1w: у stream-up нет heartbeat на аплинке, а downlink-GET молчит,
    # пока нет данных (короткий grpc_read_timeout даёт "upstream timed out").
    # Путь без хвостового "/" (см. комментарий к gRPC выше).
    location ^~ __XHTTP_PATH__ {
        client_max_body_size 0;
        client_body_buffer_size 0;
        client_body_timeout 1w;
        grpc_read_timeout 1w;
        grpc_send_timeout 1w;
        grpc_buffer_size 64k;
        send_timeout 1w;
        grpc_set_header Host $host;
        grpc_pass grpc://127.0.0.1:__XRAY_XHTTP_PORT__;
    }

    # Подписки (HTML/JSON + TXT).
    # root + /sub/... uri → /usr/local/etc/xray/sub/default_...txt
    location ~ ^/sub/[A-Za-z0-9_-]+_[A-Za-z0-9]+\.html$ {
        root /usr/local/etc/xray;
        try_files $uri =404;
        types { text/html html; }
        access_log off;
        gzip off;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header Referrer-Policy 'no-referrer' always;
        add_header X-Frame-Options 'DENY' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none';" always;
    }

    location ~ ^/sub/[A-Za-z0-9_-]+_[A-Za-z0-9]+\.txt$ {
        root /usr/local/etc/xray;
        try_files $uri =404;
        default_type text/plain;
        access_log off;
        gzip off;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Referrer-Policy 'no-referrer' always;
    }

    location ~ ^/sub/[A-Za-z0-9_-]+_[A-Za-z0-9]+\.yaml$ {
        root /usr/local/etc/xray;
        try_files $uri =404;
        default_type text/plain;
        access_log off;
        gzip off;
        add_header Cache-Control 'no-cache, no-store, must-revalidate' always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Referrer-Policy 'no-referrer' always;
    }

    # Сайт-заглушка (имитация легального трафика)
    location / {
        proxy_pass __STUB__;
        proxy_http_version 1.1;
        proxy_set_header Host __PROXY_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Via;
        proxy_hide_header X-Cache;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Runtime;
        proxy_hide_header Server;
    }

    access_log /var/log/nginx/access.log main_safe;
    error_log  /var/log/nginx/error.log;
}
