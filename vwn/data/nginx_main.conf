# Главный nginx.conf (VWNpy). Nginx слушает ТОЛЬКО loopback 127.0.0.1:8443
# (см. conf.d/xray.conf); публичный 443 терминирует Xray(Reality) и сам
# отдаёт fallback на nginx. Дефолтный 80-й server из source-сборки убран.
user root;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 0;

    # подключаем наши server-блоки (xray loopback + подписки)
    include /etc/nginx/conf.d/*.conf;
}
