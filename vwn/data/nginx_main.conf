# Главный nginx.conf (VWNpy). Nginx слушает ТОЛЬКО loopback 127.0.0.1:8443
# (см. conf.d/xray.conf); публичный 443 терминирует Xray(Reality) и сам
# отдаёт fallback на nginx. Дефолтный 80-й server из source-сборки убран.
user root;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    client_max_body_size 0;

    # подключаем наши server-блоки (xray loopback + подписки)
    include /etc/nginx/conf.d/*.conf;
}
